name: Verify atlas

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'index.html'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'index.html'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check readable source formatting
        run: python scripts/format.py
      - name: Check that index.html matches sources and data
        run: python scripts/build.py --check
      - name: Check portable build and asset boundaries
        run: python -m unittest discover -s tests -p test_public_build.py -v
      - name: Install isolated test browser
        run: python -m playwright install --with-deps chromium
      - name: Run regression tests headlessly
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-test-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
